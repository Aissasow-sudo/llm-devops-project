apiVersion: v1
kind: ConfigMap
metadata:
  name: ollama-config
  namespace: llm-devops
data:
  OLLAMA_HOST: "0.0.0.0:11434"
  OLLAMA_MODELS: "/root/.ollama/models"
  OLLAMA_KEEP_ALIVE: "5m"
  OLLAMA_MAX_LOADED_MODELS: "1"
  OLLAMA_LOAD_TIMEOUT: "15m"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: webui-config
  namespace: llm-devops
data:
  OLLAMA_BASE_URL: "http://ollama:11434"
  WEBUI_PORT: "8080"
